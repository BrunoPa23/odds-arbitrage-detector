# Levanta la API y la web con un comando: docker compose up --build
services:
  api:
    build: ./OddsArbitrage.Api
    environment:
      # Con MODO_DEMO=true la API sirve datos de ejemplo y no necesita ODDS_API_KEY
      TheOddsApi__ApiKey: ${ODDS_API_KEY:-}
      TheOddsApi__ModoDemo: ${MODO_DEMO:-false}
    ports:
      - "5162:8080"
    restart: unless-stopped

  web:
    build: ./OddsArbitrage.Web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
